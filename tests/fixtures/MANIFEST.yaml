  # Split (SPLIT).
  - path: tr/text/tr.split.de/golden_t11_split_nvda.txt
    synthetic: true
    imitates: tr.split.de
    description: Golden portfolio T11, NVIDIA split; the document shows only the new total of 20 shares.
  - path: tr/text/tr.split.de/split_msciw.txt
    synthetic: true
    imitates: tr.split.de
    description: Split of a second instrument, to check the layout is not tied to one ISIN.

  # Account statement, 2023 layout (KONTOAUSZUG, two-line entries).
  - path: tr/text/tr.kontoauszug.de.2023/kontoauszug_2023_q1.txt
    synthetic: true
    imitates: tr.kontoauszug.de.2023
    description: A deposit, a buy and a dividend, plus one unrecognised row type (negative case, unparsed_row).
  - path: tr/text/tr.kontoauszug.de.2023/kontoauszug_2023_q3.txt
    synthetic: true
    imitates: tr.kontoauszug.de.2023
    description: A savings-plan buy, interest, a sell and a withdrawal.

  # Account statement, 2024 layout (UMSATZÜBERSICHT, TYP column, "€" amounts).
  - path: tr/text/tr.kontoauszug.de.2024/golden_h1_statement.txt
    synthetic: true
    imitates: tr.kontoauszug.de.2024
    description: Golden portfolio H1 statement, the 11 lines that match T1 to T10 and T12 (plan 1.2).
  - path: tr/text/tr.kontoauszug.de.2024/kontoauszug_2024_q4.txt
    synthetic: true
    imitates: tr.kontoauszug.de.2024
    description: Interest and a withdrawal, plus one unrecognised row type (negative case, unparsed_row).

  # Corporate actions P0 recognises but does not convert (exchange, subscription; plan 5.3.5).
  - path: tr/text/tr.corporate_action.de/umtausch.txt
    synthetic: true
    imitates: a Trade Republic exchange notice (UMTAUSCH)
    description: Negative case. Must give the corporate_action review kind, no transaction.
  - path: tr/text/tr.corporate_action.de/bezug.txt
    synthetic: true
    imitates: a Trade Republic subscription rights notice (BEZUG)
    description: Negative case. Must give the corporate_action review kind, no transaction.

  # Documents no single parser may claim.
  - path: tr/text/unclassified/unknown_cost_information.txt
    synthetic: true
    imitates: Trade Republic cost information sheet (KOSTENINFORMATION), which no parser reads
    description: Negative case. Must give unknown_layout.
  - path: tr/text/unclassified/two_layouts_mixed.txt
    synthetic: true
    imitates: tr.wertpapierabrechnung.de.2019 and tr.wertpapierabrechnung.de.2023 in one file
    description: Negative case. A 2019 trade on page 1 and a 2023 trade on page 2. Must give ambiguous_layout.

  # PDFs written by tr/make_pdfs.py from the text fixtures above (reportlab, Helvetica, invariant).
  - path: tr/pdf/tr.wertpapierabrechnung.de.2019/kauf_market_winter.pdf
    synthetic: true
    imitates: tr.wertpapierabrechnung.de.2019
    generated_from: tr/text/tr.wertpapierabrechnung.de.2019/kauf_market_winter.txt
