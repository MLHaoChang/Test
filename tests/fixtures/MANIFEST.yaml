  - path: tr/text/tr.dividende.de/ausschuettung_msciw_no_tax.txt
    synthetic: true
    imitates: tr.dividende.de
    description: Fund distribution (AUSSCHÜTTUNG title) with no tax withheld and no settlement block.

  # Tax correction and advance lump sum (STEUERKORREKTUR, VORABPAUSCHALE).
  - path: tr/text/tr.steuer.de/steuerkorrektur_erstattung.txt
    synthetic: true
    imitates: tr.steuer.de
    description: Tax correction with a positive total (a refund credited to the account).
  - path: tr/text/tr.steuer.de/vorabpauschale_belastung.txt
    synthetic: true
    imitates: tr.steuer.de
    description: Advance lump sum tax with a negative total (a debit) and two tax lines.

  # Interest statement (ABRECHNUNG ZINSEN).
  - path: tr/text/tr.zinsen.de/zinsen_mit_steuer.txt
    synthetic: true
    imitates: tr.zinsen.de
