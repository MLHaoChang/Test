    generated_from: tr/text/unclassified/unknown_cost_information.txt
    description: Golden portfolio input that must land in the review queue as unknown_layout.

  # Same-day savings plans (plan 6.2): two executions for the same ETF, day and amount.
  - path: idempotency/same_day_savings_plans/same_day_a.pdf
    synthetic: true
    imitates: tr.sparplan.de
    generated_from: tr/text/tr.sparplan.de/same_day_a.txt
    description: Document A of the pair.
  - path: idempotency/same_day_savings_plans/same_day_a_copy.pdf
    synthetic: true
    imitates: tr.sparplan.de
    generated_from: tr/text/tr.sparplan.de/same_day_a.txt
    description: Document A again with another PDF title, so the bytes differ but the text is the same.
  - path: idempotency/same_day_savings_plans/same_day_b.pdf
    synthetic: true
    imitates: tr.sparplan.de
    generated_from: tr/text/tr.sparplan.de/same_day_b.txt
    description: Document B of the pair, different from A only in its execution number.
