[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playground"
version = "0.1.0"
description = "Stock trading portfolio analysis: import, reconcile, value with FIFO lots"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
    "SQLAlchemy>=2.0",
    "httpx>=0.25",
    "pyarrow>=15.0",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.6",
    "tzdata>=2024.1",
    # configs/benchmarks.yaml (plan 4.3) is read at runtime by marketdata/benchmarks.py.
    "pyyaml>=6.0",
]

[project.scripts]
pg = "playground.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.0",
    "pytest-playwright>=0.4",
    # Development only (plan 2.2): writes the synthetic PDF fixtures from their text files.
    "reportlab>=5.0",
    # Type stubs for pyyaml, so mypy can check src/playground/http and src/playground/marketdata
    # (both parse YAML) without an ignore_missing_imports override.
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ", "PT", "SIM", "TID"]
extend-select = ["I"]
ignore = ["E501"]
# TID251 (banned-api) is scoped to src/ by exempting tests/** here: pytest-playwright
# is a legitimate dev dependency for the web end-to-end test, so a Python test may
# import playwright, but no module under src/ may (see banned-api below).
per-file-ignores = {"tests/**" = ["S101", "S603", "S607", "TID251"]}

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Design review condition 9: read-only scope, no broker login, no scraping, no order
# path. No module under src/ may import a broker-scraping or browser-automation
# package (2.2). Playwright itself is fine as a dev/test dependency; it just must
# not be imported from src/.
"pytr" = {msg = "No broker login or scraping: the app only reads Trade Republic exports (CSV and PDF)."}
"requests_html" = {msg = "No browser automation for broker data: see docs/playground-spec.md condition 9."}
"selenium" = {msg = "No browser automation for broker data: see docs/playground-spec.md condition 9."}
"playwright" = {msg = "playwright is a test-only dependency; it must not be imported from src/."}

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "playground.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "playground.ledger.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "playground.valuation.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "playground.importer.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker and no first-party stub package (plan 5.6, 4.2: the Parquet
# lake); yaml's stubs come from the types-PyYAML dev dependency instead, so it needs no override.
module = "pyarrow.*"
ignore_missing_imports = true
